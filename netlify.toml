# Netlify config for the Boundia dashboard UI (React app)

[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter dashboard build"
  publish = "apps/dashboard/dist"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_USE_PNPM = "true"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
